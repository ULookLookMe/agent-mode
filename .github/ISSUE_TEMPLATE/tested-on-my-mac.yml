name: Tested on my Mac
description: Tell us whether agentmode works on your Mac. This helps everyone.
labels: [compatibility]
title: "Tested on: <Mac model>, macOS <version>"
body:
  - type: markdown
    attributes:
      value: |
        agentmode has been tested live on one MacBook Pro (M5). Reports from other Macs tell others whether
        the temperature sensors are readable and whether closed-lid mode works.
  - type: input
    id: mac
    attributes:
      label: Mac model and chip
      placeholder: MacBook Pro 14" (M1 Pro, 2021)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "27.1"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: agentmode version
      placeholder: agentmode 0.1.0
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Output of `agentmode status` with the mode on
      description: The `Heat protection` and temperature lines matter most.
      render: text
    validations:
      required: true
  - type: dropdown
    id: closed-lid
    attributes:
      label: With the mode on, did the Mac stay awake with the lid closed?
      options:
        - "Yes"
        - "No"
        - Did not try
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
